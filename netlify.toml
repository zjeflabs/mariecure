# Statische site zonder bundler. De build kopieert enkel de websitebestanden naar
# dist/, zodat README.md, netlify.toml en de broncode in api/ niet online staan.
# Een redirect volstaat daarvoor niet: Netlify serveerde api/auth.mjs ondanks
# een geforceerde redirect. Nieuw bestand in de root? Voeg het hier toe.
[build]
  command = "rm -rf dist && mkdir dist && cp -R *.html favicon.ico robots.txt sitemap.xml assets admin dist/"
  publish = "dist"

# De /admin-login (api/auth.mjs) zet zelf zijn URL via `config.path`.
[functions]
  directory = "api"

# Eén adres per pagina voor Google: de site draait op www.mariecure.be met nette
# URL's, maar de .html-varianten en het netlify.app-adres gaven ook een 200.
[[redirects]]
  from = "https://mariecure.netlify.app/*"
  to = "https://www.mariecure.be/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/behandelingen.html"
  to = "/behandelingen"
  status = 301
  force = true

[[redirects]]
  from = "/fotos.html"
  to = "/fotos"
  status = 301
  force = true

[[redirects]]
  from = "/contact.html"
  to = "/contact"
  status = 301
  force = true

[[redirects]]
  from = "/bedankt.html"
  to = "/bedankt"
  status = 301
  force = true

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
