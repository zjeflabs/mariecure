# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  repo: zjeflabs/mariecure
  branch: main
  # base_url (de inlog-/wachtwoordpagina op /api) wordt dynamisch gezet in
  # admin/index.html, zodat hij meegaat met het huidige domein
  # (Vercel-URL nu, www.mariecure.be later).
  #
  # Toon enkel de "Sign In with GitHub"-knop (= onze wachtwoordpagina),
  # verberg de "Sign In Using Access Token"-knop om verwarring te vermijden.
  auth_methods: [oauth]

# Nieuwe foto's worden hier geupload; bestaande foto's blijven in /assets/img.
media_folder: assets/img/gallery
public_folder: /assets/img/gallery

locale: nl

collections:
  - name: site
    label: Website
    files:
      - name: gallery
        label: "Foto's (galerij)"
        file: assets/data/gallery.json
        description: "Voeg foto's toe of verwijder ze. De volgorde hier is de volgorde op de website."
        fields:
          - label: "Foto's"
            name: photos
            label_singular: Foto
            widget: list
            summary: "{{fields.alt}}"
            fields:
              - { label: Afbeelding, name: image, widget: image }
              - { label: "Omschrijving (alt-tekst)", name: alt, widget: string, required: false }
